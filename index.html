<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Nexus Scan AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f4fb;--c:#fff;--t:#14172b;--m:#6b7090;--a:#5b5bf0;--a2:#9b5cf6;--b:#e3e5f2}
@media(prefers-color-scheme:dark){:root{--bg:#0c0e1b;--c:#161a2f;--t:#eef0ff;--m:#9aa0c8;--a:#8087ff;--a2:#b38bff;--b:#262a46}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}body{background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
header h2{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header button{color:#fff;font-size:20px;padding:4px 8px}
main{flex:1;overflow:auto;padding:12px 14px;min-height:0}
nav{display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0;font-size:11px;color:var(--m)}nav button i{display:block;font-style:normal;font-size:20px}nav .on{color:var(--a)}
nav .fab{transform:translateY(-14px);flex:0 0 62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:28px;padding:0;box-shadow:0 6px 16px #5b5bf055;margin:0 6px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.doc{position:relative;display:flex;flex-direction:column;gap:6px}.doc img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#8883}
.doc b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc small,small{color:var(--m)}
.star{position:absolute;top:14px;right:14px;background:#0008;color:#fff;border-radius:50%;width:28px;height:28px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--c);border:1px solid var(--b);font-size:13px}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tile{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px 4px;font-size:12px;text-align:center}.tile i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.pg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.th{position:relative;flex:none;width:84px;border:2px solid transparent;border-radius:8px}.th.on{border-color:var(--a)}.th img{width:100%;border-radius:6px}.th b{position:absolute;bottom:2px;left:4px;font-size:11px;background:#000a;color:#fff;padding:0 5px;border-radius:6px}
.cam{position:relative;flex:1;background:#000;min-height:0;overflow:hidden}.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{display:flex;align-items:center;justify-content:space-around;padding:10px;background:#000;color:#fff}.bar button{color:#fff;font-size:13px;padding:8px 10px}
.shot{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#ffffff33!important}
.ed{flex:1;min-height:0;display:flex;background:#111;touch-action:none}.ed canvas{width:100%;height:100%}
.pri{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:12px;padding:11px 16px}.sec{border:1px solid var(--b);border-radius:12px;padding:10px 14px;background:var(--c)}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.md>div{background:var(--c);width:100%;max-height:80%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:10;max-width:90%;opacity:0;transition:.2s;pointer-events:none}
</style></head><body><div id="app" style="display:contents"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let docs=[],folders=['Inbox'],cur=null,sort='date',q='',view='home',D=null,sel=new Set(),pend=[],E,F;
const idb=new Promise(r=>{try{const o=indexedDB.open('nx',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
async function save(){const d=await idb;if(d)try{d.transaction('k','readwrite').objectStore('k').put({docs,folders},'s')}catch(e){toast('Storage full or unavailable')}}
async function load(){const d=await idb;if(!d)return;return new Promise(r=>{const g=d.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r()})}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2500)}
function modal(title,body,btns){return new Promise(res=>{const m=document.createElement('div');m.className='md';m.innerHTML=`<div><b>${esc(title)}</b>${body}<div style="display:flex;gap:8px;justify-content:flex-end">${btns.map((b,i)=>`<button class="${i==btns.length-1?'pri':'sec'}" data-i="${i}">${b}</button>`).join('')}</div></div>`;document.body.appendChild(m);m.onclick=e=>{const b=e.target.closest('[data-i]');if(b){const v=[...m.querySelectorAll('input:not([type=checkbox]),select')].map(x=>x.value),ta=(m.querySelector('textarea')||{}).value,ch=[...m.querySelectorAll('input[type=checkbox]')].map(x=>x.checked);m.remove();res({i:+b.dataset.i,v:v[0],ch,ta})}else if(e.target===m){m.remove();res({i:0})}}})}
const ask=async(t,v='')=>{const r=await modal(t,`<input value="${esc(v)}">`,['Cancel','OK']);return r.i==1?r.v:null};
const pick=async(t,opts)=>{const r=await modal(t,`<select>${opts.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`,['Cancel','OK']);return r.i==1?+r.v:-1};
function go(v){stopCam();view=v;render()}
function mk(name,pages,folder){const t=Date.now(),d={id:t+Math.random().toString(36).slice(2,5),name,pages,folder:folder||cur||'Inbox',c:t,m:t,pin:0};docs.unshift(d);save();return d}
const kb=d=>Math.round(d.pages.reduce((a,p)=>a+p.length*.75,0)/1024);
const imgOf=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
const toBlob=(c,q=.9)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function render(){const a=$('#app');a.innerHTML=({home,docv,cam,edit,filt,tools,qr,gen}[view]||home)();after[view]&&after[view]()}
const after={};
function navbar(){const n=(v,i,l)=>`<button class="${view==v?'on':''}" onclick="go('${v}')"><i>${i}</i>${l}</button>`;return `<nav>${n('home','⌂','Home')}${n('tools','✦','Tools')}<button class="fab" onclick="openCam()">＋</button>${n('qr','▦','QR')}${n('gen','◫','QR Maker')}</nav>`}
function home(){let l=docs.filter(d=>(!cur||d.folder==cur)&&d.name.toLowerCase().includes(q.toLowerCase()));l.sort((a,b)=>b.pin-a.pin||(sort=='name'?a.name.localeCompare(b.name):sort=='time'?b.m-a.m:b.c-a.c));
return `<header><h2>Nexus Scan AI</h2></header><main><input placeholder="Search documents" value="${esc(q)}" oninput="q=this.value;render();$('main input').focus()"><div class="chips">${[['date','Date'],['name','Name'],['time','Time']].map(s=>`<button class="chip ${sort==s[0]?'on':''}" onclick="sort='${s[0]}';render()">${s[1]}</button>`).join('')}</div>
<div class="chips"><button class="chip ${!cur?'on':''}" onclick="cur=null;render()">All</button>${folders.map(f=>`<button class="chip ${cur==f?'on':''}" onclick="cur='${esc(f)}';render()">📁 ${esc(f)}</button>`).join('')}<button class="chip" onclick="newFolder()">＋ Folder</button></div>
${l.length?`<div class="grid">${l.map(d=>`<div class="card doc" onclick="openDoc('${d.id}')"><img src="${d.pages[0]}"><button class="star" onclick="event.stopPropagation();pin('${d.id}')">${d.pin?'★':'☆'}</button><b>${esc(d.name)}</b><small>${d.pages.length} p · ${kb(d)} KB · ${esc(d.folder)}</small></div>`).join('')}</div>`:`<p style="text-align:center;margin-top:60px" class="m"><small>No documents yet. Tap ＋ to scan or use Tools to import.</small></p>`}</main>${navbar()}`}
async function newFolder(){const n=await ask('New folder');if(n&&n.trim()&&!folders.includes(n.trim())){folders.push(n.trim());save();render()}}
function pin(id){const d=docs.find(x=>x.id==id);d.pin=d.pin?0:1;save();render()}
function openDoc(id){D=docs.find(x=>x.id==id);sel=new Set();go('docv')}
function docv(){const T=(f,i,l)=>`<button class="tile" onclick="${f}"><i>${i}</i>${l}</button>`;return `<header><button onclick="go('home')">‹</button><h2>${esc(D.name)}</h2><button onclick="rename()">✎</button></header><main><small>${D.pages.length} pages · ${kb(D)} KB · tap pages to select</small><div class="pg">${D.pages.map((p,i)=>`<div class="th ${sel.has(i)?'on':''}" onclick="sel.has(${i})?sel.delete(${i}):sel.add(${i});render()"><img src="${p}"><b>${i+1}</b></div>`).join('')}</div><div class="tiles">${T('exPdf(0)','⬇','Download PDF')}${T('exPdf(1)','🔗','Share PDF')}${T('exJpg()','🖼','Export JPG')}${T('exZip()','🗜','PDF → ZIP')}${T('prn()','🖨','Print')}${T('compress()','📉','Compress')}${T('split()','✂','Split')}${T('pw()','🔒','Password PDF')}${T('mv(0)','📂','Move')}${T('mv(1)','⧉','Copy')}${T('addPg()','＋','Add pages')}${T('del()','🗑','Delete')}</div></main>${navbar()}`}
async function rename(){const n=await ask('Rename document',D.name);if(n&&n.trim()){D.name=n.trim();D.m=Date.now();save();render()}}
async function del(){const r=await modal('Delete "'+D.name+'"?','<small>This removes it from this app.</small>',['Cancel','Delete']);if(r.i==1){docs=docs.filter(x=>x!=D);save();go('home')}}
async function mv(copy){const i=await pick(copy?'Copy to folder':'Move to folder',folders);if(i<0)return;if(copy){mk(D.name+' (copy)',[...D.pages],folders[i]);toast('Copied')}else{D.folder=folders[i];D.m=Date.now();save();toast('Moved')}render()}
async function split(){if(!sel.size)return toast('Select pages first');mk(D.name+' (split)',[...sel].sort((a,b)=>a-b).map(i=>D.pages[i]),D.folder);toast('Split document added to Home');sel=new Set()}
function addPg(){pend=[];go('tools');toast('Import images, then merge from Tools')}
async function pdfOf(d,pw){const J=window.jspdf.jsPDF;const im=await Promise.all(d.pages.map(imgOf));let p;im.forEach((m,i)=>{const o=m.width>m.height?'l':'p';if(!i)p=new J(Object.assign({unit:'px',format:[m.width,m.height],orientation:o,compress:true},pw?{encryption:{userPassword:pw,ownerPassword:pw+'#own',userPermissions:['print','copy']}}:{}));else p.addPage([m.width,m.height],o);p.addImage(m,'JPEG',0,0,m.width,m.height)});return p.output('blob')}
async function out(blob,name,sh){const f=new File([blob],name,{type:blob.type});if(sh&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name=='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(sh?'Sharing unavailable, download started':'Download started')}
async function exPdf(sh){try{toast('Building PDF…');out(await pdfOf(D),D.name+'.pdf',sh)}catch(e){toast('PDF failed: '+e.message)}}
async function pw(){const p=await ask('Set a password for the exported PDF (leave empty for none)');if(p===null)return;if(!p)return toast('Saved documents here are stored without a password; export again for an open PDF');out(await pdfOf(D,p),D.name+'-protected.pdf',1)}
async function exJpg(){const i=await pick('Export which page?',D.pages.map((_,i)=>'Page '+(i+1)));if(i>=0)out(await (await fetch(D.pages[i])).blob(),D.name+'-'+(i+1)+'.jpg',0)}
async function exZip(){const z=new JSZip();D.pages.forEach((p,i)=>z.file(`${D.name}-${i+1}.jpg`,p.split(',')[1],{base64:true}));const b=await z.generateAsync({type:'blob'});out(b,D.name+'.zip',0);const n=mk(D.name+' (zip)',[...D.pages],D.folder);toast('ZIP saved; copy added to Home')}
function prn(){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);f.srcdoc='<style>img{width:100%;page-break-after:always}</style>'+D.pages.map(p=>`<img src="${p}">`).join('');f.onload=()=>{try{f.contentWindow.print()}catch(e){toast('Print blocked here — use Share PDF, then print')}}}
async function compress(){const L=[['Low compression (best quality)',.85,1],['Medium',.6,.8],['High',.45,.65],['Maximum (smallest)',.3,.5]];const i=await pick('Compression level',L.map(l=>l[0]));if(i<0)return;toast('Compressing…');const o=[];for(const p of D.pages){const m=await imgOf(p),c=document.createElement('canvas');c.width=Math.round(m.width*L[i][2]);c.height=Math.round(m.height*L[i][2]);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(m,0,0,c.width,c.height);o.push(c.toDataURL('image/jpeg',L[i][1]))}const n=mk(D.name+' (compressed)',o,D.folder);toast(`${kb(D)} KB → ${kb(n)} KB, added to Home`);render()}
// camera
let stream,track,torchMode=0,autoCap=1,tm,stab=0,lq=null;
function cam(){return `<header><button onclick="go('home')">‹</button><h2>Scan${pend.length?' · '+pend.length+' page(s)':''}</h2>${pend.length?'<button onclick="finish()" style="font-size:14px">Done</button>':''}</header><div class="cam"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><p id="cerr" style="position:absolute;top:40%;left:0;right:0;text-align:center;color:#fff;padding:0 24px"></p></div><div class="bar"><button id="tb" onclick="torch()">🔦 Off</button><button class="shot" onclick="shoot()"></button><button id="ab" onclick="autoCap^=1;this.textContent=autoCap?'Auto: On':'Auto: Off'">Auto: On</button><label class="sec" style="color:#fff;font-size:13px;padding:8px">Import<input type="file" accept="image/*" multiple hidden onchange="imp(this.files)"></label></div>`}
async function openCam(){view='cam';render();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});const v=$('#v');v.srcObject=stream;track=stream.getVideoTracks()[0];tm=setInterval(tick,180)}catch(e){$('#cerr').textContent='Camera not available here ('+e.name+'). Use Import, or install the APK and allow camera permission.'}}
function stopCam(){clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());stream=track=null}
async function torch(){const cp=track&&track.getCapabilities?track.getCapabilities():{};if(!cp.torch)return toast('Torch not supported on this camera');torchMode=(torchMode+1)%3;$('#tb').textContent='🔦 '+['Off','On','Auto'][torchMode];setT(torchMode==1)}
async function setT(on){try{await track.applyConstraints({advanced:[{torch:on}]})}catch(e){}}
function detect(s,sw,sh){const w=120,h=Math.max(1,Math.round(120*sh/sw)),c=document.createElement('canvas');c.width=w;c.height=h;const k=c.getContext('2d',{willReadFrequently:true});k.drawImage(s,0,0,w,h);const d=k.getImageData(0,0,w,h).data,g=new Uint8Array(w*h),H=new Array(256).fill(0);let avg=0;for(let i=0;i<w*h;i++){g[i]=.3*d[4*i]+.59*d[4*i+1]+.11*d[4*i+2];H[g[i]]++;avg+=g[i]}avg/=w*h;let sum=0;for(let i=0;i<256;i++)sum+=i*H[i];let sb=0,wb=0,mx=0,th=128,tot=w*h;for(let i=0;i<256;i++){wb+=H[i];if(!wb)continue;const wf=tot-wb;if(!wf)break;sb+=i*H[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>mx){mx=v;th=i}}
const rc=new Array(h).fill(0),cc=new Array(w).fill(0);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[y*w+x]>th){rc[y]++;cc[x]++}
const lo=(a,n)=>a.findIndex(v=>v>n*.4),hi=(a,n)=>{for(let i=a.length-1;i>=0;i--)if(a[i]>n*.4)return i;return -1};const t=lo(rc,w),b=hi(rc,w),l=lo(cc,h),r=hi(cc,h);
if(t<0||b-t<h*.3||r-l<w*.3)return{q:[[.06,.06],[.94,.06],[.94,.94],[.06,.94]],ok:0,avg};return{q:[[l/w,t/h],[(r+1)/w,t/h],[(r+1)/w,(b+1)/h],[l/w,(b+1)/h]],ok:1,avg}}
function tick(){const v=$('#v');if(!v||!v.videoWidth)return;const r=detect(v,v.videoWidth,v.videoHeight),o=$('#ov');o.width=o.clientWidth;o.height=o.clientHeight;const x=o.getContext('2d'),sc=Math.max(o.width/v.videoWidth,o.height/v.videoHeight),ox=(v.videoWidth*sc-o.width)/2,oy=(v.videoHeight*sc-o.height)/2;
if(r.ok){x.strokeStyle='#4dffb0';x.fillStyle='#4dffb033';x.lineWidth=3;x.beginPath();r.q.forEach((p,i)=>{const X=p[0]*v.videoWidth*sc-ox,Y=p[1]*v.videoHeight*sc-oy;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.fill();x.stroke()}
if(torchMode==2&&track){const on=r.avg<70;if(tick.on!==on){tick.on=on;setT(on)}}
const same=lq&&r.ok&&r.q.every((p,i)=>Math.abs(p[0]-lq[i][0])<.02&&Math.abs(p[1]-lq[i][1])<.02);stab=same?stab+1:0;lq=r.ok?r.q:null;if(autoCap&&stab>=8){stab=-12;shoot()}}
function shoot(){const v=$('#v');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);stopCam();startEdit(c)}
async function imp(fs){for(const f of fs){const u=URL.createObjectURL(f),m=await imgOf(u),s=Math.min(1,2200/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);stopCam();if(fs.length==1)return startEdit(c);pend.push(c.toDataURL('image/jpeg',.9))}finish()}
function startEdit(c){const r=detect(c,c.width,c.height);E={src:c,q:r.q,ok:r.ok,d:-1};view='edit';render()}
function edit(){return `<header><button onclick="openCam()">‹</button><h2>Crop ${E.ok?'· document detected':'· adjust corners'}</h2></header><div class="ed"><canvas id="ec"></canvas></div><div class="bar"><button onclick="E.q=detect(E.src,E.src.width,E.src.height).q;drawE()">Auto-detect</button><button onclick="E.q=[[0,0],[1,0],[1,1],[0,1]];drawE()">Full page</button><button onclick="rot()">⟳ Rotate</button><button class="pri" onclick="applyCrop()">Next ›</button></div>`}
let Eg;after.edit=()=>{const c=$('#ec');c.width=c.clientWidth;c.height=c.clientHeight;drawE();const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{const[x,y]=pt(e);let b=-1,bd=60;E.q.forEach((p,i)=>{const d=Math.hypot(p[0]*Eg.w+Eg.x-x,p[1]*Eg.h+Eg.y-y);if(d<bd){bd=d;b=i}});E.d=b;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(E.d<0)return;const[x,y]=pt(e);E.q[E.d]=[Math.min(1,Math.max(0,(x-Eg.x)/Eg.w)),Math.min(1,Math.max(0,(y-Eg.y)/Eg.h))];drawE()};c.onpointerup=()=>E.d=-1}
function drawE(){const c=$('#ec'),x=c.getContext('2d'),s=E.src,k=Math.min(c.width/s.width,c.height/s.height);Eg={w:s.width*k,h:s.height*k};Eg.x=(c.width-Eg.w)/2;Eg.y=(c.height-Eg.h)/2;x.clearRect(0,0,c.width,c.height);x.drawImage(s,Eg.x,Eg.y,Eg.w,Eg.h);x.strokeStyle='#4dffb0';x.lineWidth=3;x.fillStyle='#4dffb022';x.beginPath();E.q.forEach((p,i)=>{const X=p[0]*Eg.w+Eg.x,Y=p[1]*Eg.h+Eg.y;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.fill();x.stroke();E.q.forEach(p=>{x.beginPath();x.arc(p[0]*Eg.w+Eg.x,p[1]*Eg.h+Eg.y,13,0,7);x.fillStyle='#fff';x.fill();x.stroke()})}
function rot(){const s=E.src,c=document.createElement('canvas');c.width=s.height;c.height=s.width;const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);E.src=c;E.q=detect(c,c.width,c.height).q;drawE()}
function warp(src,q){const P=q.map(p=>[p[0]*src.width,p[1]*src.height]),d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);let W=Math.max(d(P[0],P[1]),d(P[3],P[2])),H=Math.max(d(P[0],P[3]),d(P[1],P[2]));const s=Math.min(1,1700/Math.max(W,H,1));W=Math.max(8,Math.round(W*s));H=Math.max(8,Math.round(H*s));const o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d'),oi=ox.createImageData(W,H),sc=document.createElement('canvas');sc.width=src.width;sc.height=src.height;const sx=sc.getContext('2d');sx.drawImage(src,0,0);const S=sx.getImageData(0,0,src.width,src.height).data,sw=src.width,sh=src.height;
for(let y=0;y<H;y++){const v=y/H;for(let x=0;x<W;x++){const u=x/W,px=(1-v)*((1-u)*P[0][0]+u*P[1][0])+v*((1-u)*P[3][0]+u*P[2][0]),py=(1-v)*((1-u)*P[0][1]+u*P[1][1])+v*((1-u)*P[3][1]+u*P[2][1]),si=(Math.min(sh-1,Math.max(0,py|0))*sw+Math.min(sw-1,Math.max(0,px|0)))*4,di=(y*W+x)*4;oi.data[di]=S[si];oi.data[di+1]=S[si+1];oi.data[di+2]=S[si+2];oi.data[di+3]=255}}ox.putImageData(oi,0,0);return o}
function applyCrop(){try{const b=warp(E.src,E.q);F={base:b,mode:'auto',lv:2};view='filt';render()}catch(e){toast('Crop failed, original kept');F={base:E.src,mode:'auto',lv:2};view='filt';render()}}
function enhance(src,mode,lv){const W=src.width,H=src.height,o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');x.drawImage(src,0,0);if(mode=='orig')return o;const bc=document.createElement('canvas');bc.width=Math.max(1,W>>4);bc.height=Math.max(1,H>>4);bc.getContext('2d').drawImage(src,0,0,bc.width,bc.height);const bg=document.createElement('canvas');bg.width=W;bg.height=H;const bx=bg.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(bc,0,0,W,H);
const id=x.getImageData(0,0,W,H),p=id.data,B=bx.getImageData(0,0,W,H).data,ct=[1.15,1.4,1.8][lv-1],th=[150,165,180][lv-1],gray=mode!='color';
for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],br=B[i],bgg=B[i+1],bb=B[i+2];if(gray){const l=.3*r+.59*g+.11*b,bl=Math.max(40,.3*br+.59*bgg+.11*bb);let n=Math.min(255,l/bl*245);n=(n-128)*ct+128;if(mode=='bw')n=n<th?0:255;r=g=b=n}else{r=Math.min(255,r/Math.max(40,br)*245);g=Math.min(255,g/Math.max(40,bgg)*245);b=Math.min(255,b/Math.max(40,bb)*245);r=(r-128)*ct+128;g=(g-128)*ct+128;b=(b-128)*ct+128}p[i]=r;p[i+1]=g;p[i+2]=b}
if(mode!='bw'){const a=[.3,.6,1][lv-1],cp=new Uint8ClampedArray(p);for(let y=1;y<H-1;y++)for(let X=1;X<W-1;X++){const i=(y*W+X)*4;for(let c=0;c<3;c++)p[i+c]=cp[i+c]+a*(4*cp[i+c]-cp[i-4+c]-cp[i+4+c]-cp[i-W*4+c]-cp[i+W*4+c])}}x.putImageData(id,0,0);return o}
function filt(){const M=[['orig','Original'],['auto','Auto'],['bw','B&W'],['gray','Gray'],['color','Color doc']],Lv=['Light','Medium','Strong'];return `<header><button onclick="view='edit';render()">‹</button><h2>Enhance</h2></header><div class="ed"><canvas id="fc"></canvas></div><div style="background:var(--c);padding:6px 10px"><div class="chips">${M.map(m=>`<button class="chip ${F.mode==m[0]?'on':''}" onclick="F.mode='${m[0]}';render()">${m[1]}</button>`).join('')}</div><div class="chips">${Lv.map((l,i)=>`<button class="chip ${F.lv==i+1?'on':''}" onclick="F.lv=${i+1};render()">${l}</button>`).join('')}</div></div><div class="bar" style="background:var(--c)"><button class="sec" onclick="addPage();openCam()">＋ Page</button><button class="pri" onclick="addPage();finish()">Save ✓</button></div>`}
after.filt=()=>{const c=$('#fc'),r=enhance(F.base,F.mode,F.lv);F.out=r;c.width=c.clientWidth;c.height=c.clientHeight;const x=c.getContext('2d'),k=Math.min(c.width/r.width,c.height/r.height);x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.drawImage(r,(c.width-r.width*k)/2,(c.height-r.height*k)/2,r.width*k,r.height*k)}
function addPage(){const r=F.out||enhance(F.base,F.mode,F.lv);pend.push(r.toDataURL('image/jpeg',.9))}
function finish(){if(!pend.length)return go('home');const d=new Date(),n=mk('Scan '+d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),pend);pend=[];D=n;sel=new Set();go('docv');toast('Saved')}
// tools
function tools(){const T=(f,i,l)=>`<button class="tile" onclick="${f}"><i>${i}</i>${l}</button>`;return `<header><h2>Tools</h2></header><main><div class="tiles">${T("$('#fi').click()",'🖼','Image → PDF')}${T('txt()','📝','Text → PDF')}${T('merge()','🧩','Merge docs')}${T("go('qr')",'▦','QR scanner')}${T("go('gen')",'◫','QR maker')}${T('openCam()','📷','Scan')}</div><input id="fi" type="file" accept="image/*" multiple hidden onchange="imp(this.files)"><p style="margin-top:14px"><small>Image → PDF: pick images, they become a document you can export as PDF. PDF → JPG / ZIP / password / split / print / compress are inside each document. Importing existing PDF files needs the Android build (PDF rendering library).</small></p></main>${navbar()}`}
async function txt(){const r=await modal('Text → PDF','<textarea rows="8" placeholder="Type or paste text"></textarea>',['Cancel','Create']);if(r.i!=1||!r.ta)return;const L=r.ta.split('\n'),pgs=[];for(let i=0;i<L.length;i+=45){const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1240,1754);x.fillStyle='#000';x.font='30px sans-serif';L.slice(i,i+45).forEach((l,j)=>x.fillText(l.slice(0,70),80,100+j*36));pgs.push(c.toDataURL('image/jpeg',.9))}mk('Text '+new Date().toLocaleDateString(),pgs);go('home');toast('Text document added')}
async function merge(){if(docs.length<2)return toast('Need at least 2 documents');const r=await modal('Merge documents',docs.map((d,i)=>`<label><input type="checkbox"> ${esc(d.name)}</label>`).join(''),['Cancel','Merge']);if(r.i!=1)return;const ds=docs.filter((_,i)=>r.ch[i]);if(ds.length<2)return toast('Select 2 or more');mk('Merged '+new Date().toLocaleDateString(),ds.flatMap(d=>d.pages));go('home');toast('Merged document added')}
// qr
function qr(){return `<header><h2>QR Scanner</h2></header><div class="cam"><video id="qv" playsinline muted autoplay></video><p id="qr" style="position:absolute;bottom:0;left:0;right:0;background:#000b;color:#fff;padding:12px;word-break:break-all"></p></div><div class="bar" id="qb"><small>Point at a QR code</small></div>${navbar()}`}
after.qr=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#qv');v.srcObject=stream;const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});tm=setInterval(()=>{if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r){clearInterval(tm);const u=r.data,isU=/^https?:\/\//i.test(u);$('#qr').textContent=u;$('#qb').innerHTML=`<button onclick="navigator.clipboard.writeText(${JSON.stringify(u).replace(/"/g,'&quot;')});toast('Copied')">Copy</button><button onclick="window.open(${JSON.stringify(isU?u:'https://www.google.com/search?q='+encodeURIComponent(u)).replace(/"/g,'&quot;')},'_blank')">${isU?'Open link':'Web search'}</button><button onclick="go('qr')">Scan again</button>`}},250)}catch(e){$('#qr').textContent='Camera unavailable ('+e.name+')'}}
function gen(){return `<header><h2>QR Maker</h2></header><main><input id="gt" placeholder="Text or URL" oninput="mkqr()"><div style="text-align:center;margin:16px"><img id="gi" style="width:230px;max-width:80%;background:#fff;padding:10px;border-radius:12px"></div><div style="display:flex;gap:8px;justify-content:center"><button class="pri" onclick="qrOut(0)">Download</button><button class="sec" onclick="qrOut(1)">Share</button></div></main>${navbar()}`}
function mkqr(){const t=$('#gt').value,i=$('#gi');if(!t){i.removeAttribute('src');return}const q=qrcode(0,'M');q.addData(t);q.make();i.src=q.createDataURL(8,4)}
async function qrOut(s){const i=$('#gi');if(!i.src)return toast('Enter text first');out(await (await fetch(i.src)).blob(),'qr.gif',s)}
load().then(s=>{if(s){docs=s.docs||[];folders=s.folders||folders}render()});
</script></body></html>
