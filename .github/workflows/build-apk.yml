# Put this at .github/workflows/build-apk.yml in a GitHub repo that has nexus-scan.html at www/index.html
name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Nexus Scan AI" com.nexus.scan --web-dir www
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: nexus-scan-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
